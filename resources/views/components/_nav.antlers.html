<div x-data="{ open: false }" class="sticky top-0 z-50 bg-white/85 backdrop-blur-lg border-b border-gray-200/50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16 items-center">
      
      <!-- Logo -->
      <div class="shrink-0">   
        <a href="/" class="font-bold text-xl text-gray-800"><img src="{{ imagery:logo:url }}" class="w-38"></a>
      </div>

      <!-- Desktop Menu -->
      <nav class="hidden md:flex space-x-8">
        {{ nav:header }}
          <a href="{{ url }}" class="text-gray-600 hover:text-gray-900 {{ is_current ? 'font-semibold text-blue-600' : '' }}">
            {{ title }}
          </a>
        {{ /nav:header }}
      </nav>

      <!-- Hamburger Button -->
      <div class="flex md:hidden">
        <button @click="open = !open" type="button" class="text-gray-600 hover:text-gray-900 focus:outline-none p-2" aria-label="Toggle Menu">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path x-show="!open" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            <path x-show="open" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Menu Dropdown -->
  <div x-show="open" class="md:hidden px-4 pt-2 pb-4 space-y-1 bg-white border-b border-gray-200">
    {{ nav:header }}
      <a href="{{ url }}" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:bg-gray-50 {{ is_current ? 'bg-blue-50 text-blue-600' : '' }}">
        {{ title }}
      </a>
    {{ /nav:header }}
  </div>
</div>
