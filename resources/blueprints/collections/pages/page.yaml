title: Page
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: lead
            field:
              type: text
              display: Lead
          -
            handle: assets_field
            field:
              container: assets
              max_files: 1
              type: assets
              display: 'Assets Field'
          -
            handle: content
            field:
              type: markdown
              display: Content
              localizable: true
              escape_markup: true
          -
            handle: label
            field:
              type: text
              display: Label
          -
            handle: template
            field:
              type: template
              display: Template
              localizable: true
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
